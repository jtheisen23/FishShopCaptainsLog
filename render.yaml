# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard → New → Blueprint → pick this repo.
#
# This runs on Render's FREE instance type. There's no disk, because the data
# lives in a Postgres database elsewhere (Neon and Supabase both have free
# tiers that don't expire) — you supply its connection string as DATABASE_URL.
#
# Two things to know about free hosting, so they don't surprise you mid-shift:
#   - A free instance sleeps after a stretch with no traffic, and the next
#     person to open it waits roughly a minute while it wakes.
#   - Free Postgres providers suspend an idle database too, adding a second
#     or two on top of that first request.
# Everything is normal speed once it's awake. See the README if you'd rather
# pay to remove the wait.

services:
  - type: web
    name: fish-shop-captains-log
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production

      # Your Postgres connection string, e.g. from Neon:
      #   postgresql://user:password@ep-xxx.us-west-2.aws.neon.tech/dbname?sslmode=require
      # Everything the restaurant logs lives here, so keep it safe — this one
      # value is the difference between a working app and an empty one.
      - key: DATABASE_URL
        sync: false

      # Render terminates HTTPS in front of the app.
      - key: SECURE_COOKIES
        value: true
      - key: TRUST_PROXY
        value: true

      - key: TIMEZONE
        value: America/Los_Angeles
      - key: BRAND_NAME
        value: Fish Shop Captain's Log

      # Your Render URL, e.g. https://fish-shop-captains-log.onrender.com
      # Recap emails link back to it. Fill this in after the first deploy tells
      # you what the URL is.
      - key: APP_URL
        sync: false

      # Email. Leave blank to deploy without recap emails for now — everything
      # else works, and you can fill these in whenever you're ready.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
